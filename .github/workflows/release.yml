name: Build and Release VSIX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish the packaged VSIX as a GitHub release'
        type: boolean
        default: false
      tag:
        description: 'Tag for the release (defaults to v<version from package.json>)'
        type: string
        default: ''
      prerelease:
        description: 'Mark the release as a pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Package VSIX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve version and package name
        id: meta
        run: |
          version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./package.json').name")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "vsix=$name-$version.vsix" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        env:
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if [ "$REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag '$REF_NAME' does not match package.json version ('v$VERSION'). Bump the version in package.json or retag."
            exit 1
          fi

      - name: Type check
        run: npm run check-types

      - name: Package extension
        run: npx vsce package --no-dependencies --out "${{ steps.meta.outputs.vsix }}"

      - name: Upload VSIX build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.vsix }}
          path: ${{ steps.meta.outputs.vsix }}
          if-no-files-found: error

      - name: Create or update GitHub release
        if: github.event_name == 'push' || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          VSIX: ${{ steps.meta.outputs.vsix }}
          VERSION: ${{ steps.meta.outputs.version }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="v$VERSION"
          fi

          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists; uploading/replacing the VSIX asset."
            gh release upload "$tag" "$VSIX" --clobber
          else
            args=(--title "$tag" --generate-notes --target "$GITHUB_SHA")
            if [ "$PRERELEASE" = "true" ]; then
              args+=(--prerelease)
            fi
            gh release create "$tag" "$VSIX" "${args[@]}"
          fi

          echo "Released \`$VSIX\` to [$tag]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag)" >> "$GITHUB_STEP_SUMMARY"
